services:
  postgres:
    image: postgres:16
    container_name: claims-builder-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims_builder
    volumes:
      - claims_builder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims_builder"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  claims_builder_pgdata:
